model:
  base_model_name: "Qwen/Qwen2.5-1.5B-Instruct"
  torch_dtype: "float16"
  load_in_4bit: true
  quant_type: "nf4"

lora:
  r: 16
  lora_alpha: 32
  target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "./lora_adapter"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  logging_steps: 10
  save_strategy: "epoch"
  evaluation_strategy: "epoch"
  max_seq_length: 1024
